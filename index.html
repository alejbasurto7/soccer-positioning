<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Find Your Spot</title>
<meta name="description" content="A free app that teaches young soccer players where to stand. Pick your position, move the ball, and watch every player move to the right spot.">
<meta name="theme-color" content="#0E5A3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="30" height="30"><span>Find Your Spot</span></div>
  <div class="top-actions">
    <button id="quizBtn" class="btn ghost" type="button">Quiz me</button>
    <button id="setupBtn" class="btn ghost" type="button" aria-label="My team and position">
      <span id="meChip" class="me-chip"></span>
    </button>
  </div>
</header>

<main class="layout">
  <section class="board">
    <div class="chips" id="sitChips" role="tablist" aria-label="Situation"></div>
    <div class="controls">
      <div class="seg" id="phaseSeg" role="radiogroup" aria-label="Who has the ball">
        <button type="button" data-phase="att">We have it</button>
        <button type="button" data-phase="def">They have it</button>
        <button type="button" data-phase="loose">Loose ball</button>
      </div>
      <div class="seg" id="sideSeg" role="radiogroup" aria-label="Which corner">
        <button type="button" data-side="L">Left corner</button>
        <button type="button" data-side="R">Right corner</button>
      </div>
      <label class="toggle hide" id="takeToggleWrap"><input type="checkbox" id="takeToggle"> I'm not taking it</label>
      <label class="toggle"><input type="checkbox" id="oppToggle" checked> Other team</label>
    </div>

    <div class="quizbar hide" id="quizBar">
      <div><strong id="quizQ">Where should you be?</strong> <span class="muted" id="quizHint">Tap the field.</span></div>
      <div class="quiz-actions">
        <span class="streak" id="streak"></span>
        <button type="button" class="btn small" id="quizNext">Next</button>
        <button type="button" class="btn small ghost" id="quizExit">Done</button>
      </div>
    </div>

    <div class="field-wrap">
      <svg id="field" tabindex="0" aria-label="Soccer field. Drag the ball, or use arrow keys to move it." role="application"></svg>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <button id="coachBtn" class="btn coach" type="button">Coach tips</button>
  </section>

  <aside class="panel" id="panel" aria-label="Coach tips">
    <div class="panel-head">
      <h2>Coach</h2>
      <button type="button" class="icon-btn" id="panelClose" aria-label="Close">&times;</button>
    </div>
    <div id="coach"></div>
  </aside>
  <div class="scrim hide" id="scrim"></div>
</main>

<dialog id="setup">
  <form method="dialog" class="setup">
    <div class="setup-head">
      <h2>My team</h2>
      <button class="btn small" id="doneBtn" value="done">Done</button>
    </div>
    <div class="setup-main">
      <div class="row">
        <input id="nameIn" class="grow" maxlength="20" autocomplete="off" placeholder="Your name (optional)" aria-label="Your name (optional)">
        <input id="numIn" class="num" type="number" min="0" max="99" inputmode="numeric" placeholder="#" aria-label="Shirt number">
      </div>
      <div class="field inline"><span>Size</span><div class="seg" id="sizeSeg"></div></div>
      <div class="field inline"><span>Formation</span><div class="seg wrap" id="formSeg"></div></div>
      <div class="field inline"><span>Kit</span><div class="kits" id="kitRow"></div></div>
    </div>
    <div class="field pos">
      <div class="pos-label">Tap your spot: <span id="posName" class="pos-name"></span></div>
      <div class="mini-wrap"><svg id="miniField" class="mini"></svg></div>
    </div>
<div class="setup-foot">
      <button type="button" class="btn ghost small" id="shareBtn">Copy team link</button>
      <p class="muted small">Coaches: send this to players so they get your setup.</p>
    </div>
  </form>
</dialog>

<div class="toast hide" id="toast" role="status"></div>

<script src="engine.js"></script>
<script src="tips.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
